<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット画面</title>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

  <div class="chat-container">
    <!-- 上部ヘッダー -->
    <header class="chat-header">
      <h1>ゲーム部グループ</h1>
    </header>

    <!-- 真ん中の会話エリア -->
    <main class="chat-messages">
      <div class="message received">
        <div class="bubble">
          最近なにか面白いPCゲームやってる？
        </div>
      </div>

      <div class="message sent">
        <div class="bubble">
          最近はFPSとかサンドボックス系のゲームをよく遊んでるよ！
        </div>
      </div>

      <div class="message received">
        <div class="bubble">
          いいね！今度一緒にマルチプレイしない？
        </div>
      </div>

      <div class="message sent">
        <div class="bubble">
          ぜひやろう！金曜日の夜とか空いてる？設定とか事前に確認しておくね。
        </div>
      </div>

      <div class="message received">
        <div class="bubble">
          金曜日なら21時くらいからログインできると思う！ヘッドセットの調子も直しておいたからボイスチャットも大丈夫。もし他にも誘えそうなメンバーがいたら声をかけておいてもいいかな？
        </div>
      </div>

      <div class="message sent">
        <div class="bubble">
          了解、他のメンバーにも聞いてみる！当日楽しみにしてるね。
        </div>
      </div>
    </main>

  
    <footer class="chat-input-area">
      <input type="text" class="chat-input" placeholder="メッセージを入力...">
      <button type="button" class="send-button">送信</button>
    </footer>
  </div>

</body>
</html>
