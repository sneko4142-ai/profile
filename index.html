<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介ページ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>ながの自己紹介</h1>
    <nav>
        <a href="#favorite">好きなもの</a>
        <a href="#schedule">1週間の予定</a>
        <a href="#form">感想を送る</a> 
    </nav>
</header>
<main>
    <p>岐阜県に住んでいる1年生です。休日は、映画鑑賞、ゲームをしています。</p>
</main>
    <h2 id="favorite">好きなもの</h2>
    <ul>
        <li class="favorite">映画</li>
        <li>ゲーム</li>
        <li>音楽</li>
    </ul>
    <h2>2026年見たベスト3</h2>
    <ol>
        <li>オデュッセイア</li>
        <li>でっちあげ</li>
        <li>告白</li>
    </ol>    
    
    <img src="screenshot HTML.png" alt="仮"width="400">    

    <h2>おすすめの映画</h2>
    <p><a href="https://kokuhou-movie.com/" target="_blank">Google検索</a></p>

    <h2>お気に入りの作品一覧</h2>
    <table>
        <tr>
            <th>ジャンル</th>
            <th>タイトル</th>
        </tr>
        <tr>
            <td>映画</td>
            <td>オデュッセイア</td>
        </tr>
        <tr>
            <td>ゲーム</td>
            <td>RDR</td>
        </tr>
    </table>

    <h2 id="schedule">１週間の予定</h2>
    <table>
        <tr>
            <th>月曜日</th>
            <td>プログラミング</td>
        <tr>
                <th>火曜日</th>
                <td>オンライン</td>
            </tr>
            <tr>
                <th>水曜日</th>
                <td>バイト</td>
            </tr> 
        </tr>
            <tr>
                <th>木曜日</th>
                <td>ハードウェア</td>
            </tr>
        </tr>
            <tr>
                <th>金曜日</th>
                <td>情報数学</td>
            </tr>                        
    </table>
    <p></p>

    <h2>お問い合わせ・感想</h2>
    <form action="#" method="post">
        <label for="user-name">お名前：</label>
        <input type="text" id="user-name" name="name"><br>

        <label>好きなジャンル：</label>
        <input type="radio" id="genre-movie" name="genre" value="movie">
        <label for="genre-movie">映画</label>
        <input type="radio" id="genre-game" name="genre" value="game">
        <label for="genre-game">ゲーム</label><br>

        <label for="user-message">メッセージ：</label><br>
        <textarea id="user-message" name="message" rows="4" cols="30"></textarea><br>

        <button type="submit">送信する</button>
    </form>
    <footer>© 2026 なが</footer>
</body>
</html>
